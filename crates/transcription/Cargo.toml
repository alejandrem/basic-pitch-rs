[package]
name = "basic-pitch-transcription"
description = "Deteccion de notas y reconstruccion temporal de basic-pitch-rs"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
basic-pitch-audio-io.workspace = true
# El tipo canonico de evento musical vive en midi-io, igual que en el
# upstream (pretty_midi define el NoteEvent junto al escritor de MIDI).
basic-pitch-midi-io.workspace = true
basic-pitch-audio-preprocess.workspace = true
# Para las constantes del contrato (bins por semitono, bins de contorno).
basic-pitch-cqt.workspace = true
basic-pitch-model.workspace = true
candle-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Solo para tests: leer los .npy de la referencia y cargar el modelo.
basic-pitch-reference-npy.workspace = true
# Lector independiente de MIDI para las pruebas de integracion (Fase 13).
midly.workspace = true
# Benchmarks estadisticos (Fase 14). Solo dev-dependency: no afecta al
# binario ni a las dependencias de produccion.
criterion = { version = "0.5", features = ["html_reports"] }
# Para medir las diferencias con el upstream.
basic-pitch-validation.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[bench]]
name = "transcripcion"
harness = false
